<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e4e8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <pattern id="blisterPockets" width="100" height="120" patternUnits="userSpaceOnUse">
      <rect x="15" y="15" width="70" height="90" rx="35" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
      <rect x="25" y="25" width="50" height="70" rx="25" fill="#e2e8f0" opacity="0.6"/>
    </pattern>
  </defs>
  <!-- Foil Strip Background -->
  <rect x="10" y="10" width="580" height="300" rx="16" fill="url(#foilGrad)" stroke="#64748b" stroke-width="3"/>
  <rect x="20" y="20" width="560" height="280" rx="12" fill="url(#blisterPockets)" opacity="0.4"/>
  
  <!-- Red Rx Alert Band -->
  <rect x="10" y="10" width="580" height="42" rx="8" fill="#dc2626"/>
  <text x="30" y="36" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">SCHEDULE H1 PRESCRIPTION DRUG - CAUTION</text>

  <!-- Medicine Branding & Composition -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="520" height="180" rx="8" fill="#ffffff" opacity="0.9" stroke="#cbd5e1"/>
    <text x="24" y="44" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#1e293b">AUGMENTIN 625 DUO</text>
    <text x="24" y="76" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#0284c7">Amoxycillin and Potassium Clavulanate Tablets IP</text>
    
    <line x1="24" y1="92" x2="496" y2="92" stroke="#e2e8f0" stroke-width="1.5"/>

    <text x="24" y="118" font-family="system-ui, sans-serif" font-size="14" fill="#334155">Each film coated tablet contains:</text>
    <text x="24" y="138" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Amoxicillin Trihydrate IP eq. to Amoxicillin 500 mg</text>
    <text x="24" y="158" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Potassium Clavulanate IP eq. to Clavulanic Acid 125 mg</text>

    <text x="380" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ea580c">10 Tablets Strip</text>
    <text x="380" y="66" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Mfg: GSK Ltd</text>
  </g>
</svg>
